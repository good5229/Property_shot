<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="속성을 훔쳐 한 번의 샷을 설계하는 모바일 퍼즐 게임.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="속성 한방">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>속성 한방</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #bfe8e3;
      color: #24352d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 36%, rgba(255, 248, 221, .94), transparent 34%),
        linear-gradient(160deg, #c8eee6 0%, #8fcfc4 100%);
      transition: opacity 180ms ease-out, visibility 180ms ease-out;
    }
    #app-loading.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loading-card {
      width: min(360px, calc(100vw - 48px));
      box-sizing: border-box;
      padding: 28px 26px 24px;
      text-align: center;
      border: 2px solid rgba(36, 53, 45, .72);
      border-radius: 24px;
      background: rgba(255, 250, 232, .94);
      box-shadow: 0 14px 36px rgba(36, 53, 45, .18);
    }
    .loading-wheel {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      animation: loading-wheel-turn 2.4s linear infinite;
    }
    .loading-wheel circle,
    .loading-wheel line {
      stroke: #2c7468;
      stroke-width: 5;
      fill: none;
      stroke-linecap: round;
    }
    .loading-wheel circle:first-child { fill: #f8d77d; stroke: #24352d; }
    .loading-title { margin: 0; font-size: 24px; font-weight: 900; }
    #app-loading-status { margin: 10px 0 16px; min-height: 24px; font-size: 16px; font-weight: 700; }
    .loading-track { height: 8px; overflow: hidden; border-radius: 99px; background: #d7e3d8; }
    .loading-track::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #2c7468;
      animation: loading-track-move 1.25s ease-in-out infinite alternate;
    }
    .loading-retry {
      min-height: 44px;
      margin-top: 16px;
      padding: 10px 18px;
      border: 2px solid #31473d;
      border-radius: 14px;
      background: #fff2bd;
      color: #24352d;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .loading-retry[hidden], .loading-track[hidden] { display: none; }
    @keyframes loading-wheel-turn { to { transform: rotate(360deg); } }
    @keyframes loading-track-move { from { transform: translateX(-15%); } to { transform: translateX(155%); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-wheel, .loading-track::after { animation: none; }
      .loading-track::after { width: 68%; }
    }
  </style>
</head>
<body>
  <div id="app-loading" aria-busy="true">
    <section id="app-loading-card" class="loading-card" role="status" aria-live="polite" aria-atomic="true">
      <svg class="loading-wheel" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="34"></circle>
        <circle cx="50" cy="50" r="9"></circle>
        <line x1="50" y1="8" x2="50" y2="27"></line>
        <line x1="50" y1="73" x2="50" y2="92"></line>
        <line x1="8" y1="50" x2="27" y2="50"></line>
        <line x1="73" y1="50" x2="92" y2="50"></line>
        <line x1="20" y1="20" x2="34" y2="34"></line>
        <line x1="66" y1="66" x2="80" y2="80"></line>
        <line x1="80" y1="20" x2="66" y2="34"></line>
        <line x1="34" y1="66" x2="20" y2="80"></line>
      </svg>
      <h1 class="loading-title">속성 한방</h1>
      <p id="app-loading-status">항해 지도를 펼치는 중</p>
      <div id="app-loading-progress" class="loading-track" role="progressbar" aria-label="게임 불러오기" aria-valuetext="준비 중"></div>
      <button id="app-loading-retry" class="loading-retry" type="button" hidden>다시 불러오기</button>
    </section>
  </div>
  <script id="bootstrap-fallback">
    window.propertyShotBootstrapFailed = function (error) {
      var loading = document.getElementById('app-loading');
      var card = document.getElementById('app-loading-card');
      var status = document.getElementById('app-loading-status');
      var progress = document.getElementById('app-loading-progress');
      var retry = document.getElementById('app-loading-retry');
      if (loading) loading.setAttribute('aria-busy', 'false');
      if (card) {
        card.setAttribute('role', 'alert');
        card.setAttribute('aria-live', 'assertive');
      }
      if (status) status.textContent = '게임을 불러오지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요.';
      if (progress) progress.hidden = true;
      if (retry) {
        retry.hidden = false;
        retry.onclick = function () { window.location.reload(); };
      }
      window.propertyShotBootstrapHasFailed = true;
      if (window.console) console.error('Property Shot bootstrap failed', error);
    };
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.propertyShotBootstrapFailed(event)"></script>
</body>
</html>
