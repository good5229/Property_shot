name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Full release quality gate
        run: ./scripts/test_extended.sh
        env:
          # Golden baselines are authored and pixel-audited on macOS. Linux
          # still renders every Golden and verifies baseline presence/canvas
          # dimensions; exact pixels remain the local/default test contract.
          PROPERTY_SHOT_GOLDEN_MODE: structure

      - name: Build Flutter web
        # SkWasm을 우선 사용하고 미지원 브라우저에는 자동 생성된 JS 빌드로
        # 폴백해 고주사율 화면의 Canvas 애니메이션 부담을 줄인다.
        run: flutter build web --release --wasm --base-href "/Property_shot/"

      - name: Add .nojekyll
        run: touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
